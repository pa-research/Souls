name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # The full game (rules3d.js) and the Discord channel room with Souls TV (channel_tv.js, which waits for games to end)
  # play nightly; pull requests and pushes run the quick browser checks.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Souls.slnx

      - name: Build
        run: dotnet build Souls.slnx -c Release --no-restore

      - name: Vulnerable packages
        run: |
          dotnet list Souls.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test --project tests/Souls.Tests -c Release --no-build

  manifests:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Kustomize overlays
        run: |
          cp deploy/k8s/overlays/dev/secrets.env.example deploy/k8s/overlays/dev/secrets.env
          cp deploy/k8s/overlays/production/secrets.env.example deploy/k8s/overlays/production/secrets.env
          for overlay in dev production; do
            kubectl kustomize "deploy/k8s/overlays/$overlay" > "/tmp/$overlay.yaml"
            echo "$overlay: $(grep -c '^kind:' /tmp/$overlay.yaml) objects"
          done

      - name: Compose file
        run: |
          touch deploy/compose/secrets/postgres-password deploy/compose/secrets/ConnectionStrings__Souls deploy/compose/secrets/Souls__Admin__Password
          docker compose config --quiet

      - name: Paired release checks
        run: bash tests/release-images.sh

  # Headless Chromium against the Compose stack (tests/e2e), one job per script so they run side by side: the quick
  # checks on pull requests and pushes, a full game against the bot nightly and on demand. Fails when a client breaks.
  e2e:
    name: Browser tests (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"name":"rules3d.js","args":"1"},{"name":"channel_tv.js","args":""}]' || '[{"name":"ui_capture.js","args":""},{"name":"classic_ui.js","args":""},{"name":"main_layout.js","args":""},{"name":"dialogue.js","args":""}]') }}
    env:
      COMPOSE_FILE: compose.yaml:tests/e2e/compose.ci.yaml
      # The 3D client checks layout and play, not pixels: it draws nothing on the GPU-less runner (?render=0).
      E2E_NORENDER: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Same layer cache as the images job, loaded under the names compose.yaml uses.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: souls-web:latest
          cache-from: type=gha,scope=web

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          load: true
          tags: souls-server:latest
          cache-from: type=gha,scope=server

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      # `up` returns once web and server are healthy and Caddy has started; then wait for Caddy to answer.
      - name: Start the stack
        id: stack
        run: |
          ./deploy/compose/init-secrets.sh
          docker compose up -d --no-build
          curl -fsSk --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null https://localhost/

      - name: ${{ matrix.suite.name }}
        working-directory: tests/e2e
        # (rules3d.js: the Normal bot; the Hard bot sometimes wins before the script has played a card, and the Hard
        # bot is covered by the .NET tests.)
        run: node ${{ matrix.suite.name }} https://localhost out/${{ matrix.suite.name }} ${{ matrix.suite.args }}

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.suite.name }}
          path: tests/e2e/out
          if-no-files-found: ignore

  images:
    name: Container images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, server]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/souls-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=candidate-${{ github.run_id }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release-images:
    name: Publish paired release tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, manifests, e2e, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash tools/release-images.sh
