# Running games are saved in PostgreSQL and survive a restart (the server saves them on SIGTERM and the next pod
# restores them), but each game is played in the memory of one instance: run exactly one replica and replace it with
# Recreate, so two pods never resume the same games.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: souls-server
  labels:
    app.kubernetes.io/name: souls-server
    app.kubernetes.io/component: game-server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: souls-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: souls-server
        app.kubernetes.io/component: game-server
    spec:
      serviceAccountName: souls
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/pa-research/souls-server
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: souls-config
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/souls
              readOnly: true
      containers:
        - name: server
          image: ghcr.io/pa-research/souls-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: souls-config
          securityContext: *containerSecurity
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/souls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: souls-secrets
            items:
              - key: ConnectionStrings__Souls
                path: ConnectionStrings__Souls
              - key: Souls__DataProtection__Certificate
                path: Souls__DataProtection__Certificate
---
apiVersion: v1
kind: Service
metadata:
  name: souls-server
  labels:
    app.kubernetes.io/name: souls-server
spec:
  selector:
    app.kubernetes.io/name: souls-server
  ports:
    - name: http
      port: 8080
      targetPort: http
