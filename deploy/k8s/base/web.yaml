apiVersion: apps/v1
kind: Deployment
metadata:
  name: souls-web
  labels:
    app.kubernetes.io/name: souls-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: souls-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: souls-web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: souls
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: souls-web
      initContainers:
        # Applies EF Core migrations and seed data. EF Core locks the database while migrating, so
        # several pods starting at once are safe.
        - name: migrate
          image: ghcr.io/pa-research/souls-web
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: souls-config
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets-migrate
              mountPath: /run/secrets/souls
              readOnly: true
      containers:
        - name: web
          image: ghcr.io/pa-research/souls-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: souls-config
          securityContext: *containerSecurity
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/souls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # No bootstrap admin password: it is only given to the migration.
        - name: secrets
          secret:
            secretName: souls-secrets
            items:
              - key: ConnectionStrings__Souls
                path: ConnectionStrings__Souls
              - key: Souls__DataProtection__Certificate
                path: Souls__DataProtection__Certificate
        - name: secrets-migrate
          secret:
            secretName: souls-secrets
            items:
              - key: ConnectionStrings__Souls
                path: ConnectionStrings__Souls
              - key: Souls__DataProtection__Certificate
                path: Souls__DataProtection__Certificate
              - key: Souls__Admin__Password
                path: Souls__Admin__Password
---
apiVersion: v1
kind: Service
metadata:
  name: souls-web
  labels:
    app.kubernetes.io/name: souls-web
spec:
  selector:
    app.kubernetes.io/name: souls-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: souls-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: souls-web
