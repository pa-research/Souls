apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: souls
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - souls.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: /ws }
      backendRefs:
        - name: souls-server
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: /healthz }
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: { type: ReplaceFullPath, replaceFullPath: / }
            statusCode: 302
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: souls-web
          port: 8080
