apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: souls
  annotations:
    # Long-lived WebSockets (ingress-nginx; other controllers have equivalent settings).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # With cert-manager: cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [souls.example.com]
      secretName: souls-tls
  rules:
    - host: souls.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: souls-server
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: souls-web
                port:
                  name: http
