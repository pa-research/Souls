apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: souls-postgres
  labels:
    app.kubernetes.io/name: souls-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: souls-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: souls-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: souls-postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user of the Alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: souls
            - name: POSTGRES_USER
              value: souls
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/souls/postgres-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "souls", "-d", "souls"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "souls", "-d", "souls"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/souls
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: souls-secrets
            items:
              - key: postgres-password
                path: postgres-password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: souls-postgres
  labels:
    app.kubernetes.io/name: souls-postgres
spec:
  selector:
    app.kubernetes.io/name: souls-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: souls-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [souls-web, souls-server]
      ports:
        - { protocol: TCP, port: 5432 }
